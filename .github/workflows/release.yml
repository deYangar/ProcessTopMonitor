name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0，tag 为 v1.0.0）'
        required: true
        type: string
  push:
    tags: ['v*']

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      # 编译参数与 plugin/build_release.bat 保持一致：
      # /MT 静态 CRT、链接显式 /OPT:REF（/DEBUG 默认 NOREF 会保留全部死代码）
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build x64
        shell: bash
        working-directory: plugin
        env:
          MSYS_NO_PATHCONV: 1   # 禁 Git Bash 把 /nologo /fo 等开关误转换成路径
        run: |
          rc /nologo /fo src/resource.res src/resource.rc
          set -o pipefail
          cl /nologo /O2 /EHsc /MT /std:c++17 /utf-8 /Zi /FS \
             /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WINDLL /Isrc \
             /FeProcessTopMonitor.dll \
             src/metrics_collector.cpp src/etw_file_collector.cpp src/core_class_mapper.cpp \
             src/gpu_collector.cpp src/top_aggregator.cpp src/top_list_window.cpp \
             src/window_manager.cpp src/options_dialog.cpp src/plugin_main.cpp src/i18n.cpp \
             /link /DLL /DEBUG /MAP /OPT:REF \
             gdi32.lib user32.lib shell32.lib dwmapi.lib advapi32.lib tdh.lib \
             comctl32.lib imm32.lib msimg32.lib pdh.lib \
             src/resource.res /OUT:ProcessTopMonitor.dll 2>&1 | tee build_x64.log
          ! grep -qi "warning" build_x64.log

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build x86
        shell: bash
        working-directory: plugin
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          set -o pipefail
          cl /nologo /O2 /EHsc /MT /std:c++17 /utf-8 /Zi /FS \
             /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WINDLL /Isrc \
             /FeProcessTopMonitor_x86.dll \
             src/metrics_collector.cpp src/etw_file_collector.cpp src/core_class_mapper.cpp \
             src/gpu_collector.cpp src/top_aggregator.cpp src/top_list_window.cpp \
             src/window_manager.cpp src/options_dialog.cpp src/plugin_main.cpp src/i18n.cpp \
             /link /DLL /DEBUG /MAP /OPT:REF \
             gdi32.lib user32.lib shell32.lib dwmapi.lib advapi32.lib tdh.lib \
             comctl32.lib imm32.lib msimg32.lib pdh.lib \
             src/resource.res /OUT:ProcessTopMonitor_x86.dll 2>&1 | tee build_x86.log
          ! grep -qi "warning" build_x86.log

      - name: Read release note
        id: note
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NOTE="docs/release-notes/v${VERSION}.md"
          if [ ! -f "$NOTE" ]; then
            echo "::error::Release note not found: $NOTE — 发版前必须先写好 note 文件"
            exit 1
          fi
          cp "$NOTE" release_body.md

      - name: Package lang bundle
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path bundle/ProcessTopMonitor/lang | Out-Null
          Copy-Item plugin/ProcessTopMonitor.dll, plugin/ProcessTopMonitor_x86.dll bundle/
          Copy-Item plugin/src/lang/English.ini bundle/ProcessTopMonitor/lang/
          Compress-Archive -Path bundle/* -DestinationPath "ProcessTopMonitor-lang-v$v.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          ASSETS=(plugin/ProcessTopMonitor.dll plugin/ProcessTopMonitor_x86.dll "ProcessTopMonitor-lang-v$VERSION.zip")
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --notes-file release_body.md || \
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              --notes-file release_body.md
          fi
